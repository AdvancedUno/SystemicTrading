[project]
name = "quant"
version = "0.1.0"
description = "Systematic trading research and execution platform"
requires-python = ">=3.12"
dependencies = [
    # Data
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "pandas>=2.2",  # some libs still need it
    "numpy>=2.0",
    # Market data
    "alpaca-py>=0.30",
    "yfinance>=0.2.40",
    "ccxt>=4.4",  # unified crypto exchange interface
    "python-binance>=1.0",
    # ML / stats
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "scipy>=1.14",
    # Backtesting / portfolio
    "vectorbt>=0.26",  # fast vectorized backtests for research
    "riskfolio-lib>=6.0",  # portfolio optimization
    # Storage / persistence
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # Tracking
    "mlflow>=2.16",
    # Config / logging / CLI
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.8",
    # Scheduling
    "apscheduler>=3.10",
    # Utilities
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "tenacity>=9.0",  # retries
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "ipykernel>=6.29",
    "jupyter>=1.1",
]
nautilus = [
    # install separately, can be tricky on some platforms
    "nautilus-trader>=1.200",
]
torch = [
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = false  # gradual typing
ignore_missing_imports = true
